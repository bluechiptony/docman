name: Deploy to Dev

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate build configuration
        env:
          DEV_API_URL: ${{ vars.DEV_API_URL }}
        run: |
          if [ -z "$DEV_API_URL" ]; then
            echo "DEV_API_URL is not configured in the dev GitHub Environment."
            exit 1
          fi
          echo "Building frontend with NEXT_PUBLIC_API_URL=$DEV_API_URL"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/docman-web-app
          tags: |
            type=ref,event=branch
            type=sha,prefix=dev-
            type=raw,value=dev-latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.DEV_API_URL }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/docman-web-app:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/docman-web-app:buildcache,mode=max

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd /srv/docman

            if [ -n "${{ secrets.DOCKER_USERNAME }}" ] && [ -n "${{ secrets.DOCKER_PASSWORD }}" ]; then
              echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
                --username "${{ secrets.DOCKER_USERNAME }}" \
                --password-stdin
            fi

            docker compose pull docman
            docker compose up -d --no-deps --force-recreate docman

            docker compose ps docman
            docker inspect docman --format 'Image ID: {{.Image}}'
