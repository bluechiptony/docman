name: Deploy to Dev

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
    types: [closed]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: dev
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/docman-web-app
          tags: |
            type=ref,event=branch
            type=sha,prefix=dev-
            type=raw,value=dev-latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.DEV_API_URL }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/docman-web:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/docman-web:buildcache,mode=max

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            # set -e
            # cd /srv/docman

            # # Optional: Log in to registry on remote to allow pulling private images
            # if [ -n "${{ secrets.DOCKER_USERNAME }}" ] && [ -n "${{ secrets.DOCKER_PASSWORD }}" ]; then
            #   docker login -u "${{ secrets.DOCKER_USERNAME }}" -p "${{ secrets.DOCKER_PASSWORD }}" || true
            # fi

            # # Ensure the latest image tag is pulled before recreating containers
            # docker compose pull
            # docker compose up -d --force-recreate --remove-orphans

            # # Verify the currently running container image and digest
            # echo "\nCurrent compose images:" 
            # docker compose images || true
            # echo "\nRunning containers:" 
            # docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'
            # echo "\nDocman container image details:" 
            # docker inspect docman --format 'Image ID: {{.Image}}' || true
            set -e
            cd /srv/docman

            # Optional: Log in to registry on remote to allow pulling private images
            if [ -n "${{ secrets.DOCKER_USERNAME }}" ] && [ -n "${{ secrets.DOCKER_PASSWORD }}" ]; then
              docker login -u "${{ secrets.DOCKER_USERNAME }}" -p "${{ secrets.DOCKER_PASSWORD }}" || true
            fi

            # Pull latest images for API and seed job
            docker compose pull docman docman-api docman-api-seed

            # Run migrations + seeding + start services
            ./deploy-with-seed.sh up

            # Verify running containers
            echo "\nRunning containers:"
            docker compose ps
